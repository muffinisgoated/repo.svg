<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xhtml="http://www.w3.org/1999/xhtml"
    width="100%"
    height="100%"
    viewBox="0 0 100 100"
    preserveAspectRatio="none"
>
    <foreignObject x="0" y="0" width="100" height="100">
        <xhtml:div
            style="
                position:relative;
                width:100%;
                height:100%;
                margin:0;
                padding:0;
                overflow:hidden;
            "
        >
            <xhtml:iframe
                src="https://xylora.org/home.html"
                style="
                    position:absolute;
                    inset:0;
                    width:100%;
                    height:100%;
                    border:0;
                    margin:0;
                    padding:0;
                    display:block;
                "
            ></xhtml:iframe>
        </xhtml:div>
    </foreignObject>
</svg>
