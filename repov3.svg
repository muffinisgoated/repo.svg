<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xhtml="http://www.w3.org/1999/xhtml"
    width="100px"
    height="100px"
    viewBox="0 0 100 100"
>
    <foreignObject
        x="0"
        y="0"
        width="100"
        height="100"
    >
        <xhtml:div
            style="
                width:100px;
                height:100px;
                overflow:hidden;
                margin:0;
                padding:0;
            "
        >
            <xhtml:iframe
                src="https://xylora.org/index.html"
                style="
                    width:100px;
                    height:100px;
                    border:0;
                    margin:0;
                    padding:0;
                    display:block;
                "
            />
        </xhtml:div>
    </foreignObject>
</svg>
