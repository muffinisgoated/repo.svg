<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 100 100"
     preserveAspectRatio="none">

  <foreignObject x="0" y="0" width="100" height="100">
    <xhtml:html>
      <xhtml:head>
        <xhtml:meta charset="UTF-8"/>
        <xhtml:meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
        />

        <xhtml:style>
          html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
          }

          iframe {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
          }
        </xhtml:style>
      </xhtml:head>

      <xhtml:body>
        <xhtml:iframe src="https://xylora.org/index.html"/>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>

</svg>
