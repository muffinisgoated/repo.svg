<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xhtml="http://www.w3.org/1999/xhtml"
    width="100vw"
    height="100vh"
    viewBox="0 0 100 100"
    preserveAspectRatio="none"
    style="position:fixed;top:0;left:0;width:100vw;height:100vh;margin:0;padding:0;"
>
    <foreignObject
        x="0"
        y="0"
        width="100"
        height="100"
    >
        <xhtml:body
            style="
                margin:0;
                padding:0;
                width:100vw;
                height:100vh;
                overflow:hidden;
            "
        >
            <xhtml:iframe
                src="https://xylora.org/index.html"
                style="
                    position:fixed;
                    top:0;
                    left:0;
                    width:100vw;
                    height:100vh;
                    border:0;
                    margin:0;
                    padding:0;
                    overflow:hidden;
                    display:block;
                "
            ></xhtml:iframe>
        </xhtml:body>
    </foreignObject>
</svg>
